name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Reconstruction nocturne (03:00 Antilles) pour récupérer les correctifs
  # de sécurité des images de base (PHP 8.4, Debian, MariaDB 11.4, node 22)
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build, migrate and restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/pomodoro

            # Le serveur est un clone du dépôt ; les secrets (.env.local,
            # .env.docker, config/jwt/*.pem) sont hors de git et ne sont pas touchés.
            git fetch --quiet origin main
            git reset --hard origin/main

            docker compose pull database
            docker compose build --pull php
            # L'entrypoint lance les migrations Doctrine puis le cache:warmup
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' pomodoro_php 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            docker compose ps
            [ "$status" = "healthy" ] || { docker logs --tail 50 pomodoro_php; exit 1; }

            docker image prune -f
